<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREG LINTON - PLAN QULLIQ - Flight Board</title>
    <style>
        :root {
            --bg-color: #1a1a1d;
            --board-bg: #222226;
            --text-color: #e0e0e0;
            --flap-bg: #111113;
            --flap-border: #444;
            --highlight: #ffffff;
            --amber: #facc15;
            --font-family: 'Consolas', 'Courier New', monospace;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 29, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            text-align: center;
        }
        #start-overlay h2 { margin-bottom: 10px; font-size: 2rem; letter-spacing: 2px; }
        #start-overlay p { margin-bottom: 30px; color: #aaa; }
        #start-overlay button { font-size: 1.5rem; padding: 15px 30px; }
        .board-container {
            background-color: var(--board-bg);
            border: 2px solid var(--text-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            max-width: 100%;
            overflow-x: auto;
            display: none;
        }
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--text-color);
            font-size: 1.5rem;
            letter-spacing: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .board-header-clock { display: flex; gap: 4px; }
        .schedule-labels {
            display: flex; gap: 20px; margin-bottom: 10px;
            font-size: 1rem; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold;
            padding-left: 5px;
        }
        .row { display: flex; gap: 20px; margin-bottom: 12px; }
        .col { display: flex; gap: 2px; }
        .flap {
            display: inline-flex; justify-content: center; align-items: center;
            width: 2.2ch; height: 2.8ch;
            background-color: var(--flap-bg); color: var(--highlight);
            font-size: 1.4rem; font-weight: bold; position: relative;
            border-bottom: 3px solid var(--text-color); box-sizing: border-box;
            border-radius: 2px; text-transform: uppercase;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
            transition: color 0.3s ease;
        }
        .flap::after {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px;
            background-color: #000; z-index: 2; opacity: 0.8;
        }
        .col-remarks .flap,
        .row-amber .flap {
            color: var(--amber);
        }
        .col-flt { width: calc((2.2ch + 2px) * 4); }
        .col-domain { width: calc((2.2ch + 2px) * 14); }
        .col-focus { width: calc((2.2ch + 2px) * 12); }
        .col-remarks { width: calc((2.2ch + 2px) * 9); }
        .label-flt { width: calc((2.2ch + 2px) * 4); }
        .label-domain { width: calc((2.2ch + 2px) * 14); }
        .label-focus { width: calc((2.2ch + 2px) * 12); }
        .label-remarks { width: calc((2.2ch + 2px) * 9); }
        button {
            background-color: transparent; color: var(--text-color);
            border: 1px solid var(--text-color); padding: 8px 16px;
            font-family: inherit; cursor: pointer; transition: all 0.2s;
        }
        button:hover { background-color: var(--text-color); color: var(--bg-color); }
    </style>
</head>
<body>
    <div id="start-overlay">
        <h2>GREG LINTON - PLAN QULLIQ</h2>
        <p>Click to start automated mechanical sequence (Spacebar to flip manually)</p>
        <button onclick="startSystem()">INITIALIZE BOARD</button>
    </div>

    <div class="board-container" id="main-board">
        <div class="board-header">
            <div>GREG LINTON - PLAN QULLIQ</div>
            <div class="board-header-clock" id="clock"></div>
        </div>
        <div class="schedule-labels">
            <div class="label-flt">FLT</div>
            <div class="label-domain">DOMAIN</div>
            <div class="label-focus">FOCUS/TOOLS</div>
            <div class="label-remarks">REMARKS</div>
        </div>
        <div id="board-rows"></div>
    </div>

    <script>
        const schedules = [
          {
                    "flt": "BC20",
                    "domain": "BARKER COLLEGE",
                    "focus": "20 YRS RCAF",
                    "remarks": "VETERAN"
          },
          {
                    "flt": "XDOM",
                    "domain": "CROSS-DOMAIN",
                    "focus": "INTEGRATION",
                    "remarks": "ADAPTIVE"
          },
          {
                    "flt": "TOOL",
                    "domain": "DIGITAL TOOLS",
                    "focus": "WIDE TOOLKIT",
                    "remarks": "PROVEN"
          },
          {
                    "flt": "OPS1",
                    "domain": "TRAINING OPS",
                    "focus": "WORKFLOWS",
                    "remarks": "ACTIVE"
          },
          {
                    "flt": "PQ26",
                    "domain": "PLAN QULLIQ",
                    "focus": "NEXT MISSION",
                    "remarks": "BOARDING"
          }
];
        const enableSound = true;

        const COL_LENGTHS = { flt: 4, domain: 14, focus: 12, remarks: 9 };
        const ALPHANUMERIC = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-"; 

        const FLIGHT_BOARD_HOLD_MS = 6000;
        const SIGNATURE_HOLD_MS = 4000;

        let showingSignature = false;
        let stateTimer;
        let audioCtx; let flapsCurrentlyMoving = 0; let soundInterval;

        function getSignatureRows() {
            const totalRows = Math.max(schedules.length, 5);
            const rows = Array.from({ length: totalRows }, () => ({
                flt: "", domain: "", focus: "", remarks: "", isAmber: false
            }));
            const mid = Math.floor(totalRows / 2);
            rows[mid - 1] = { flt: "", domain: "          GREG", focus: "LINTON      ", remarks: "", isAmber: false };
            rows[mid + 1] = { flt: "", domain: "       SYSTEMS", focus: "THINKING    ", remarks: "", isAmber: true };
            return rows;
        }

        function startSystem() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('main-board').style.display = 'block';
            
            if (enableSound) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                startMechanicalSoundLoop();
            }
            
            renderBoard(schedules);
            animateFlaps();
            initClock();
            scheduleNextState();
        }

        function playTickSound() {
            if (!audioCtx || !enableSound) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.02);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.02);
        }

        function startMechanicalSoundLoop() {
            if (!enableSound) return;
            soundInterval = setInterval(() => { if (flapsCurrentlyMoving > 0) playTickSound(); }, 60);
        }

        function padString(str, length) {
            return (str || "").toString().substring(0, length).padEnd(length, ' ').toUpperCase();
        }

        function createFlapsHTML(str) {
            return str.split('').map(char => `<span class="flap" data-target="${char}"> </span>`).join('');
        }

        function renderBoard(rowsData) {
            const container = document.getElementById('board-rows');
            container.innerHTML = '';
            rowsData.forEach(data => {
                const row = document.createElement('div');
                const highlightRow = data.isAmber || 
                    (data.remarks && data.remarks.toUpperCase().includes('BOARDING')) || 
                    (data.flt && data.flt.toUpperCase() === 'PQ26');
                row.className = highlightRow ? 'row row-amber' : 'row';

                const cFlt = padString(data.flt, COL_LENGTHS.flt);
                const cDomain = padString(data.domain, COL_LENGTHS.domain);
                const cFocus = padString(data.focus, COL_LENGTHS.focus);
                const cRemarks = padString(data.remarks, COL_LENGTHS.remarks);
                row.innerHTML = `
                    <div class="col col-flt">${createFlapsHTML(cFlt)}</div>
                    <div class="col col-domain">${createFlapsHTML(cDomain)}</div>
                    <div class="col col-focus">${createFlapsHTML(cFocus)}</div>
                    <div class="col col-remarks">${createFlapsHTML(cRemarks)}</div>
                `;
                container.appendChild(row);
            });
        }

        function animateFlaps() {
            const flaps = document.querySelectorAll('#board-rows .flap');
            flaps.forEach(flap => {
                const targetChar = flap.getAttribute('data-target');
                const targetIndex = ALPHANUMERIC.indexOf(targetChar) > -1 ? ALPHANUMERIC.indexOf(targetChar) : 0;
                const spinCycles = Math.floor(Math.random() * 15) + 15; 
                let currentCycle = 0; let currentIndex = Math.floor(Math.random() * ALPHANUMERIC.length);
                flapsCurrentlyMoving++;
                const interval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % ALPHANUMERIC.length;
                    flap.textContent = ALPHANUMERIC[currentIndex];
                    currentCycle++;
                    if (currentCycle >= spinCycles && currentIndex === targetIndex) {
                        clearInterval(interval); flap.textContent = targetChar; flapsCurrentlyMoving--;
                    }
                }, 40);
            });
        }

        function initClock() {
            const clockDiv = document.getElementById('clock');
            function updateClock() {
                const now = new Date();
                const hrs = now.getHours().toString().padStart(2, '0');
                const mins = now.getMinutes().toString().padStart(2, '0');
                const timeStr = `${hrs}${mins}`; 
                if (clockDiv.getAttribute('data-current') !== timeStr) {
                    clockDiv.setAttribute('data-current', timeStr);
                    clockDiv.innerHTML = createFlapsHTML(hrs) + '<span style="display:flex;align-items:center;margin:0 5px;">:</span>' + createFlapsHTML(mins);
                    const clockFlaps = clockDiv.querySelectorAll('.flap');
                    clockFlaps.forEach(flap => {
                        const targetChar = flap.getAttribute('data-target');
                        const targetIndex = ALPHANUMERIC.indexOf(targetChar);
                        let currentIndex = 0; let cycles = 0;
                        flapsCurrentlyMoving++;
                        const inv = setInterval(() => {
                            currentIndex = (currentIndex + 1) % ALPHANUMERIC.length;
                            flap.textContent = ALPHANUMERIC[currentIndex];
                            if(++cycles > 15 && currentIndex === targetIndex) { 
                                clearInterval(inv); flap.textContent = targetChar; flapsCurrentlyMoving--;
                            }
                        }, 40);
                    });
                }
            }
            updateClock(); setInterval(updateClock, 10000);
        }

        function toggleState() {
            clearTimeout(stateTimer);
            showingSignature = !showingSignature;
            renderBoard(showingSignature ? getSignatureRows() : schedules);
            animateFlaps();
            scheduleNextState();
        }

        function scheduleNextState() {
            clearTimeout(stateTimer);
            const delay = showingSignature ? SIGNATURE_HOLD_MS : FLIGHT_BOARD_HOLD_MS;
            stateTimer = setTimeout(toggleState, delay);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.getElementById('main-board').style.display === 'block') {
                e.preventDefault();
                toggleState();
            }
        });
    </script>
</body>
</html>
